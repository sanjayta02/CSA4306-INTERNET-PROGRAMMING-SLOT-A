<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | BusEase</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">B</span> BusEase</a><nav><a href="index.html">Home</a><a href="buses.html">Find Buses</a></nav></header><main class="auth"><section><p class="eyebrow">WELCOME ABOARD</p><h1>Your journey<br><em>starts here.</em></h1><p class="muted">Create an account to book seats and manage your trips.</p></section><section class="panel"><div class="tabs"><button class="active" data-mode="login">Login</button><button data-mode="register">Register</button></div><form id="auth-form"><h2 id="auth-heading">Welcome back</h2><label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" minlength="4" required placeholder="Demo password"><div id="reg-fields" hidden><label>Full name</label><input id="fullname" placeholder="Passenger name"><label>Phone</label><input id="phone" placeholder="Optional phone"></div><button class="btn wide" id="auth-submit">Login ↗</button><p class="note">Prototype only: use fictional details. Password recovery and change-password controls are demonstrative, not connected to email.</p></form><p id="auth-msg" class="message"></p></section></main><script src="js/app.js"></script></body></html>
