<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | RailReserve</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">RR</span><span>RailReserve<small>TRAIN RESERVATION SYSTEM</small></span></a><nav><a href="index.html">Home</a><a href="trains.html">Find Trains</a><a href="login.html">Login</a></nav></header><main class="auth-wrap"><section class="auth-card wide"><span class="eyebrow">JOIN RAILRESERVE</span><h1>Create your account</h1><p class="muted">Save your trips and manage reservations from your dashboard.</p><form id="registerForm" class="form-grid"><label>Full name<input name="name" required placeholder="Passenger name"></label><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Phone number<input name="phone" required pattern="[0-9+ -]{8,16}" placeholder="Mobile number"></label><label>Password<input name="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn primary full span-two">Create account</button></form><p class="auth-bottom">Already registered? <a href="login.html">Sign in</a></p></section></main><footer><p>RailReserve • Internet Programming Lab</p></footer><script src="js/app.js"></script></body></html>
