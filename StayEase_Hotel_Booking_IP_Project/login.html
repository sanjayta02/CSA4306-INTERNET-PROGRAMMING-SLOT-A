<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account | StayEase</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">S</span> StayEase</a><nav><a href="index.html">Home</a><a href="rooms.html">Rooms</a><a href="contact.html">Contact</a></nav></header><main class="auth-layout"><section class="auth-intro"><p class="eyebrow">WELCOME TO STAYEASE</p><h1>Your next trip,<br><em>all in one place.</em></h1><p>Sign in or create a demo account to explore profile and booking management.</p></section><section class="panel"><div class="tabs"><button class="tab active" data-tab="login">Log in</button><button class="tab" data-tab="register">Create account</button></div><form id="login-form"><h2 id="auth-title">Welcome back</h2><label>Email address</label><input type="email" id="login-email" required placeholder="you@example.com"><label>Password</label><input type="password" id="login-password" required minlength="4" placeholder="At least 4 characters"><div id="register-fields" hidden><label>Full name</label><input id="register-name" placeholder="Your full name"><label>Phone number</label><input id="register-phone" placeholder="Optional phone number"></div><button class="button full" type="submit" id="auth-submit">Log in ↗</button><p class="form-note">Demo mode stores account data in this browser only. Do not use a real password.</p></form><div id="auth-message" class="message" aria-live="polite"></div></section></main><script src="js/app.js"></script></body></html>
