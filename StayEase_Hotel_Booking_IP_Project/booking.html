<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a room | StayEase</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">S</span> StayEase</a><nav><a href="index.html">Home</a><a href="rooms.html">Rooms</a><a href="dashboard.html">My dashboard</a></nav></header><main class="page-wrap narrow"><p class="eyebrow">MAKE IT OFFICIAL</p><h1>Reserve your room</h1><p class="muted">Enter dates to check the demo inventory. Booking is simulated; no real payment is taken.</p><section class="panel"><form id="booking-form"><label>Room type</label><select id="booking-room"></select><div class="form-row"><div><label>Check-in</label><input type="date" id="booking-checkin" required></div><div><label>Check-out</label><input type="date" id="booking-checkout" required></div></div><div class="form-row"><div><label>Guests</label><select id="booking-guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div><label>Payment demo</label><select id="payment-method"><option>Pay at hotel (demo)</option><option>Card gateway placeholder (demo only)</option></select></div></div><button type="button" class="button button-outline" onclick="checkAvailability()">Check availability</button><div id="availability-message" class="message"></div><label>Special request (optional)</label><textarea id="booking-notes" rows="3" placeholder="Accessibility or arrival notes"></textarea><button class="button full" type="submit">Confirm demo booking ↗</button></form></section></main><script src="js/app.js"></script></body></html>
